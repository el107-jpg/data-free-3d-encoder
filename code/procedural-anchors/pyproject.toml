[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-arm-planner"
version = "0.1.0"
description = "Minimal seven-joint point-cloud amortized trajectory optimizer"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "tensorboard>=2.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8,<3.11", "contourpy<1.4"]
diagnostics = ["scipy>=1.11", "osqp>=1.0"]
warp = ["warp-lang==1.18.0"]
mesh = ["trimesh>=4.5,<5", "rtree>=1.3", "manifold3d>=3", "scikit-image>=0.24", "scipy>=1.11", "stream-unzip>=0.0.99", "plotly>=5", "shapely>=2", "pymeshlab>=2023.12"]
analysis = ["scikit-learn>=1.3", "umap-learn>=0.5", "matplotlib>=3.8,<3.11"]

[project.scripts]
arm-planner-train = "arm_planner.drummer.train:main"
arm-planner-fr3-train = "arm_planner.drummer.fr3:main"
arm-planner-demo = "arm_planner.drummer.demo:main"
arm-planner-launch = "arm_planner.drummer.launch:main"
arm-planner-legacy-train = "arm_planner.train:main"
arm-planner-legacy-demo = "arm_planner.demo:main"
geometry-encoder-train = "arm_planner.train_geometry:main"
object-geometry-train = "arm_planner.object_geometry.train:main"
object-geometry-validate = "arm_planner.object_geometry.validate:main"
mesh-sdf-train = "arm_planner.object_geometry.sdf_recipe:main"
mesh-sdf-library-train = "arm_planner.object_geometry.full_library:main"

[tool.setuptools.packages.find]
include = ["arm_planner", "arm_planner.*"]

[tool.setuptools.package-data]
arm_planner = ["assets/fr3/*", "assets/fr3/collision/*", "assets/fr3/analytic_ik/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
